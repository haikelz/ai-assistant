apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-assistant
  labels:
    app: ai-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ai-assistant
  template:
    metadata:
      labels:
        app: ai-assistant
    spec:
      terminationGracePeriodSeconds: 30
      volumes:
        - name: picoclaw-data
          persistentVolumeClaim:
            claimName: ai-assistant-data
        - name: vps-ssh
          secret:
            secretName: ai-assistant-vps-ssh
            optional: true
            defaultMode: 0400
      initContainers:
        - name: initialize-workspace
          image: haikelilham/ai-assistant
          imagePullPolicy: Always
          command: ["/bin/sh", "-ec"]
          args:
            - |
              configure-ai /seed/config.json /root/.picoclaw/config.json
              if [ ! -f /root/.picoclaw/workspace/SOUL.md ]; then cp -R /seed/workspace /root/.picoclaw/workspace; fi
              mkdir -p /root/.picoclaw/workspace/skills/job-search
              cp /seed/workspace/skills/job-search/SKILL.md /root/.picoclaw/workspace/skills/job-search/SKILL.md
              mkdir -p /root/.picoclaw/workspace/skills/vps-ops
              cp /seed/workspace/skills/vps-ops/SKILL.md /root/.picoclaw/workspace/skills/vps-ops/SKILL.md
              CLEAN_BOT_TOKEN=$(printenv TELEGRAM_BOT_TOKEN | tr -d '\r\n')
              printf 'channels:\n  telegram:\n    settings:\n      token: "%s"\n' "$CLEAN_BOT_TOKEN" > /root/.picoclaw/.security.yml
          env:
            - name: AI_PROVIDER
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: AI_PROVIDER
                  optional: true
            - name: AI_MODEL
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: AI_MODEL
                  optional: true
            - name: SUMOPOD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: SUMOPOD_API_KEY
                  optional: true
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: GOOGLE_API_KEY
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: OPENAI_API_KEY
                  optional: true
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: TELEGRAM_BOT_TOKEN
            - name: TELEGRAM_USER_ID
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: TELEGRAM_USER_ID
          volumeMounts:
            - name: picoclaw-data
              mountPath: /root/.picoclaw
        - name: initialize-paycheck-reminder
          image: haikelilham/ai-assistant
          imagePullPolicy: Always
          command: ["/bin/sh", "-ec"]
          args:
            - |
              if ! picoclaw cron list | grep -Fq monthly-paycheck-reminder; then
                picoclaw cron add --name monthly-paycheck-reminder --cron "0 9 28 * *" --channel telegram --to "$(printenv TELEGRAM_USER_ID)" --message "Today is the 28th in Asia/Jakarta. Ask the user for their payday amount in rupiah. When they give a clear amount, record it as Modal through the finance-ledger skill and confirm the total money."
              fi
          env:
            - name: TZ
              value: Asia/Jakarta
            - name: TELEGRAM_USER_ID
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: TELEGRAM_USER_ID
          volumeMounts:
            - name: picoclaw-data
              mountPath: /root/.picoclaw
      containers:
        - name: picoclaw
          image: haikelilham/ai-assistant:latest
          imagePullPolicy: Always
          env:
            - name: TZ
              value: Asia/Jakarta
            - name: AI_PROVIDER
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: AI_PROVIDER
                  optional: true
            - name: AI_MODEL
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: AI_MODEL
                  optional: true
            - name: SUMOPOD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: SUMOPOD_API_KEY
                  optional: true
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: GOOGLE_API_KEY
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: OPENAI_API_KEY
                  optional: true
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: TELEGRAM_BOT_TOKEN
            - name: TELEGRAM_USER_ID
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: TELEGRAM_USER_ID
            - name: WHATSAPP_RECIPIENT
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: WHATSAPP_RECIPIENT
                  optional: true
            - name: JOB_ALERT_PIPELINE_ENABLED
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: JOB_ALERT_PIPELINE_ENABLED
                  optional: true
            - name: GLINTS_ENABLED
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: GLINTS_ENABLED
                  optional: true
            - name: LINKEDIN_ENABLED
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: LINKEDIN_ENABLED
                  optional: true
            - name: LINKEDIN_PAGES
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: LINKEDIN_PAGES
                  optional: true
            - name: LINKEDIN_MAX_DETAILS
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: LINKEDIN_MAX_DETAILS
                  optional: true
            - name: LINKEDIN_POSTED_WITHIN_HOURS
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: LINKEDIN_POSTED_WITHIN_HOURS
                  optional: true
            - name: LINKEDIN_DISTANCE
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: LINKEDIN_DISTANCE
                  optional: true
            - name: LINKEDIN_JOB_TYPES
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: LINKEDIN_JOB_TYPES
                  optional: true
            - name: LINKEDIN_COMPANY_IDS
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: LINKEDIN_COMPANY_IDS
                  optional: true
            - name: JOB_ALERT_DB_PATH
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: JOB_ALERT_DB_PATH
                  optional: true
            - name: JOB_ALERT_MAX_QUERIES
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: JOB_ALERT_MAX_QUERIES
                  optional: true
            - name: JOB_ALERT_AI_BATCH_SIZE
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: JOB_ALERT_AI_BATCH_SIZE
                  optional: true
            - name: JOB_ALERT_MIN_MATCH_SCORE
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: JOB_ALERT_MIN_MATCH_SCORE
                  optional: true
            - name: MAIL_MAILER
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: MAIL_MAILER
                  optional: true
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: MAIL_USERNAME
                  optional: true
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: MAIL_PASSWORD
                  optional: true
            - name: MAIL_HOST
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: MAIL_HOST
                  optional: true
            - name: MAIL_PORT
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: MAIL_PORT
                  optional: true
            - name: MAIL_ENCRYPTION
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: MAIL_ENCRYPTION
                  optional: true
            - name: MAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: MAIL_FROM
                  optional: true
            - name: MAIL_TO
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: MAIL_TO
                  optional: true
            - name: STARCO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: STARCO_USERNAME
                  optional: true
            - name: STARCO_URL
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: STARCO_URL
                  optional: true
            - name: STARCO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: STARCO_PASSWORD
                  optional: true
            - name: STARCO_ATTENDANCE_URL
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: STARCO_ATTENDANCE_URL
                  optional: true
            - name: STARCO_CLOCK_IN_SELECTOR
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: STARCO_CLOCK_IN_SELECTOR
                  optional: true
            - name: STARCO_CLOCK_OUT_SELECTOR
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: STARCO_CLOCK_OUT_SELECTOR
                  optional: true
            - name: STARCO_GEO_LATITUDE
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: STARCO_GEO_LATITUDE
                  optional: true
            - name: STARCO_GEO_LONGITUDE
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: STARCO_GEO_LONGITUDE
                  optional: true
            - name: STARCO_TIMEOUT_SECONDS
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: STARCO_TIMEOUT_SECONDS
                  optional: true
          ports:
            - name: http
              containerPort: 18790
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: picoclaw-data
              mountPath: /root/.picoclaw
            - name: vps-ssh
              mountPath: /run/secrets/vps-ssh
              readOnly: true
