apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-assistant
  labels:
    app: ai-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ai-assistant
  template:
    metadata:
      labels:
        app: ai-assistant
    spec:
      terminationGracePeriodSeconds: 30
      volumes:
        - name: picoclaw-data
          persistentVolumeClaim:
            claimName: ai-assistant-data
      initContainers:
        - name: initialize-workspace
          image: haikelilham/ai-assistant
          imagePullPolicy: Always
          command: ["/bin/sh", "-ec"]
          args:
            - |
              configure-ai /seed/config.json /root/.picoclaw/config.json
              if [ ! -f /root/.picoclaw/workspace/SOUL.md ]; then cp -R /seed/workspace /root/.picoclaw/workspace; fi
              mkdir -p /root/.picoclaw/workspace/skills/job-search
              cp /seed/workspace/skills/job-search/SKILL.md /root/.picoclaw/workspace/skills/job-search/SKILL.md
              CLEAN_BOT_TOKEN=$(printenv TELEGRAM_BOT_TOKEN | tr -d '\r\n')
              printf 'channels:\n  telegram:\n    settings:\n      token: "%s"\n' "$CLEAN_BOT_TOKEN" > /root/.picoclaw/.security.yml
          env:
            - name: AI_PROVIDER
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: AI_PROVIDER
            - name: AI_MODEL
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: AI_MODEL
            - name: SUMOPOD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: SUMOPOD_API_KEY
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: GOOGLE_API_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: OPENAI_API_KEY
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: TELEGRAM_BOT_TOKEN
            - name: TELEGRAM_USER_ID
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: TELEGRAM_USER_ID
          volumeMounts:
            - name: picoclaw-data
              mountPath: /root/.picoclaw
        - name: initialize-paycheck-reminder
          image: haikelilham/ai-assistant
          imagePullPolicy: Always
          command: ["/bin/sh", "-ec"]
          args:
            - |
              if ! picoclaw cron list | grep -Fq monthly-paycheck-reminder; then
                picoclaw cron add --name monthly-paycheck-reminder --cron "0 9 28 * *" --channel telegram --to "$(printenv TELEGRAM_USER_ID)" --message "Today is the 28th in Asia/Jakarta. Ask the user for their payday amount in rupiah. When they give a clear amount, record it as Modal through the finance-ledger skill and confirm the total money."
              fi
          env:
            - name: TZ
              value: Asia/Jakarta
            - name: TELEGRAM_USER_ID
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: TELEGRAM_USER_ID
          volumeMounts:
            - name: picoclaw-data
              mountPath: /root/.picoclaw
      containers:
        - name: picoclaw
          image: haikelilham/ai-assistant:latest
          imagePullPolicy: Always
          env:
            - name: TZ
              value: Asia/Jakarta
            - name: AI_PROVIDER
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: AI_PROVIDER
            - name: AI_MODEL
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: AI_MODEL
            - name: SUMOPOD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: SUMOPOD_API_KEY
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: GOOGLE_API_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: OPENAI_API_KEY
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: TELEGRAM_BOT_TOKEN
            - name: TELEGRAM_USER_ID
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: TELEGRAM_USER_ID
            - name: WHATSAPP_RECIPIENT
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: WHATSAPP_RECIPIENT
            - name: MAIL_MAILER
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: MAIL_MAILER
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: MAIL_USERNAME
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: MAIL_PASSWORD
            - name: MAIL_HOST
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: MAIL_HOST
            - name: MAIL_PORT
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: MAIL_PORT
            - name: MAIL_ENCRYPTION
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: MAIL_ENCRYPTION
            - name: MAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: MAIL_FROM
            - name: MAIL_TO
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-env
                  key: MAIL_TO
          ports:
            - name: http
              containerPort: 18790
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: picoclaw-data
              mountPath: /root/.picoclaw
